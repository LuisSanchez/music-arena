# CLASH local stack: API (synthesis) + UI (nginx proxies /api)
#
#   docker compose up --build
#   open http://localhost:8080
#
# First match can take ~5–15s while the engine presses two ~120s cuts.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      # Browser hits the UI origin; keep local ports allowed for direct API use
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin /api via nginx → api:8000
        VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
